<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Christmas - Final Clean</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100%; height: 100vh; display: block; }
        
        #ui-layer {
            position: absolute; bottom: 30px; width: 100%;
            text-align: center; pointer-events: none; z-index: 100;
        }
        
        .guide { 
            color: rgba(255, 255, 255, 0.6); 
            font-size: 13px; 
            margin-bottom: 20px; 
            text-shadow: 0 2px 4px black;
        }

        button {
            pointer-events: auto; cursor: pointer;
            background: linear-gradient(to bottom, #D32F2F, #8B0000); 
            color: #FFF; border: 2px solid #FFD700;
            padding: 15px 50px; border-radius: 30px; 
            font-weight: 800; font-size: 16px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        #camera-preview {
            position: absolute; top: 15px; right: 15px;
            width: 120px; height: 90px;
            border: 2px solid rgba(255,0,0,0.5); 
            transform: scaleX(-1); opacity: 0.6; border-radius: 8px;
        }
        
        #copyright {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            z-index: 100;
            font-family: sans-serif;
            pointer-events: none;
            font-style: italic;
        }

        #debug-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            font-size: 12px;
            z-index: 1000;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="debug-info">
        <div>State: <span id="debug-state">-</span></div>
        <div>Textures: <span id="debug-textures">0/5</span></div>
    </div>

    <div id="ui-layer">
        <div class="guide">
            🖐 <b>Open:</b> Explode &nbsp;|&nbsp; 🫶 <b>Heart:</b> Love &nbsp;|&nbsp; ✊ <b>Fist:</b> Tree
        </div>
        <button id="btnStart" onclick="startSystem()">START MAGIC</button>
    </div>

    <div id="copyright">© by vandiep</div>

    <div id="canvas-container"></div>
    <video class="input_video" style="display:none"></video>
    <canvas id="camera-preview"></canvas>

    <script>
        // ================= FIXED CODE =================
        const MUSIC_URL = "audio.mp3";  // FIXED: removed ./
        let bgMusic = new Audio(MUSIC_URL);
        bgMusic.loop = true; bgMusic.volume = 0.7;

        // SIMPLIFIED - Direct loading for GitHub Pages
        const photoFiles = [
            "image1.jpg",
            "image2.jpg",
            "image3.jpg",
            "image4.jpg",
            "image5.jpg"
        ];
        
        const photoTextures = [];
        let loadedTextures = 0;
        
        function loadTextures() {
            console.log("🔄 Loading textures for GitHub Pages...");
            const loader = new THREE.TextureLoader();
            
            photoFiles.forEach((file, index) => {
                photoTextures[index] = loader.load(
                    file,
                    (texture) => {
                        loadedTextures++;
                        console.log(`✅ Loaded: ${file}`);
                        updateDebug();
                        texture.needsUpdate = true;
                    },
                    undefined,
                    (error) => {
                        console.error(`❌ Failed: ${file}`, error);
                        // Create colored placeholder
                        const canvas = document.createElement('canvas');
                        canvas.width = 512; canvas.height = 512;
                        const ctx = canvas.getContext('2d');
                        const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF'];
                        ctx.fillStyle = colors[index];
                        ctx.fillRect(0, 0, 512, 512);
                        ctx.fillStyle = 'white';
                        ctx.font = '40px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(`Photo ${index+1}`, 256, 256);
                        photoTextures[index] = new THREE.CanvasTexture(canvas);
                        loadedTextures++;
                        updateDebug();
                    }
                );
            });
        }
        
        function updateDebug() {
            document.getElementById('debug-textures').textContent = `${loadedTextures}/5`;
        }

        // Three.js config
        const CONFIG = {
            goldCount: 1000,
            redCount: 200,
            giftCount: 100,
            explodeRadius: 50,
            photoOrbitRadius: 25,
            treeHeight: 60,
            treeBaseRadius: 25
        };

        let scene, camera, renderer;
        let groupGold, groupRed, groupGift;
        let photoMeshes = [];
        let state = 'TREE';
        let handX = 0.5;

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 80;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Create particles
            groupGold = createParticleSystem('gold', CONFIG.goldCount, 2.0);
            groupRed = createParticleSystem('red', CONFIG.redCount, 3.0);
            groupGift = createParticleSystem('gift', CONFIG.giftCount, 2.5);

            createPhotos();
            animate();
        }

        function createParticleSystem(type, count, size) {
            const positions = [];
            const treeTargets = [];
            const explodeTargets = [];
            
            for(let i = 0; i < count; i++) {
                // Tree shape
                const h = Math.random() * CONFIG.treeHeight;
                const y = h - CONFIG.treeHeight/2;
                const ratio = (CONFIG.treeHeight - h) / CONFIG.treeHeight;
                const r = ratio * CONFIG.treeBaseRadius * Math.random();
                const angle = Math.random() * Math.PI * 2;
                treeTargets.push(
                    Math.cos(angle) * r,
                    y,
                    Math.sin(angle) * r
                );
                
                // Explode shape
                const phi = Math.acos(2 * Math.random() - 1);
                const theta = Math.random() * Math.PI * 2;
                const radius = CONFIG.explodeRadius * Math.random();
                explodeTargets.push(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta),
                    radius * Math.cos(phi)
                );
                
                positions.push(treeTargets[i*3], treeTargets[i*3+1], treeTargets[i*3+2]);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.userData = { tree: treeTargets, explode: explodeTargets };

            const material = new THREE.PointsMaterial({
                size: size,
                color: type === 'gold' ? 0xFFD700 : type === 'red' ? 0xFF0000 : 0xFFFFFF,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);
            return points;
        }

        function createPhotos() {
            const geometry = new THREE.PlaneGeometry(8, 8);
            
            for(let i = 0; i < 5; i++) {
                const material = new THREE.MeshBasicMaterial({
                    map: photoTextures[i] || null,
                    side: THREE.DoubleSide,
                    transparent: true
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                mesh.visible = false;
                mesh.scale.set(0, 0, 0);
                scene.add(mesh);
                photoMeshes.push(mesh);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            // Update particles
            updateParticleGroup(groupGold, state, 0.05, time);
            updateParticleGroup(groupRed, state, 0.05, time);
            updateParticleGroup(groupGift, state, 0.05, time);
            
            // Update photos in EXPLODE mode
            if (state === 'EXPLODE') {
                photoMeshes.forEach((mesh, i) => {
                    if (photoTextures[i]) {
                        mesh.visible = true;
                        const angle = time * 0.5 + (i * Math.PI * 2 / 5);
                        mesh.position.x = Math.cos(angle) * CONFIG.photoOrbitRadius;
                        mesh.position.z = Math.sin(angle) * CONFIG.photoOrbitRadius;
                        mesh.position.y = Math.sin(time + i) * 2;
                        mesh.lookAt(camera.position);
                        const scale = 0.5 + Math.abs(Math.sin(time + i)) * 0.3;
                        mesh.scale.set(scale, scale, scale);
                    }
                });
            } else {
                photoMeshes.forEach(mesh => {
                    mesh.visible = false;
                });
            }
            
            renderer.render(scene, camera);
        }

        function updateParticleGroup(group, state, speed, time) {
            const positions = group.geometry.attributes.position.array;
            const targets = group.geometry.userData[state === 'TREE' ? 'tree' : 'explode'];
            
            for(let i = 0; i < positions.length; i++) {
                positions[i] += (targets[i] - positions[i]) * speed;
            }
            
            group.geometry.attributes.position.needsUpdate = true;
            
            // Add some animation
            group.rotation.y += 0.005;
            if (state === 'EXPLODE') {
                group.material.opacity = 0.7 + Math.sin(time * 3) * 0.3;
            } else {
                group.material.opacity = 0.8;
            }
        }

        function startSystem() {
            console.log("🎄 Starting Magic Christmas...");
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('debug-state').textContent = 'STARTED';
            
            // Try to play music
            bgMusic.play().catch(e => {
                console.log("Note: Music autoplay blocked - user interaction required");
            });
            
            // Load textures first, then init 3D
            loadTextures();
            setTimeout(() => {
                init3D();
                initHandTracking();
            }, 1000);
        }

        function initHandTracking() {
            const video = document.querySelector('.input_video');
            const canvas = document.getElementById('camera-preview');
            const ctx = canvas.getContext('2d');
            
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults((results) => {
                if (canvas) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (results.image) {
                        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
                    }
                }
                
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    handX = landmarks[9].x; // Middle finger base
                    
                    // Simple gesture detection
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    const middleTip = landmarks[12];
                    
                    const thumbIndexDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                    const indexMiddleDist = Math.hypot(indexTip.x - middleTip.x, indexTip.y - middleTip.y);
                    
                    if (thumbIndexDist < 0.05) {
                        state = 'PHOTO';
                    } else if (indexMiddleDist < 0.1) {
                        state = 'TREE';
                    } else {
                        state = 'EXPLODE';
                    }
                    
                    document.getElementById('debug-state').textContent = state;
                }
            });
            
            const camera = new Camera(video, {
                onFrame: async () => {
                    await hands.send({image: video});
                },
                width: 320,
                height: 240
            });
            
            camera.start();
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
